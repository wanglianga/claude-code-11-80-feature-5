services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ccdev
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/ccdev
      DB_USER: ccdev
      DB_PASSWORD: ccdev
      APP_OPERATOR_PASSWORD: operator123
      APP_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
